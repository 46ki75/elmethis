version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    ignore:
      # A2UI schemas and zod-to-json-schema require Zod 3 compatibility.
      # Coordinate major migrations manually; minor and patch updates stay enabled.
      - dependency-name: "zod"
        update-types:
          - "version-update:semver-major"
    groups:
      react-updates:
        patterns:
          - "react"
          - "react-dom"
      react-types-updates:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      vitest-updates:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-*"
      ag-ui-updates:
        patterns:
          - "@ag-ui/client"
          - "@ag-ui/core"
      copilotkit-updates:
        patterns:
          - "@copilotkit/runtime"
          - "@copilotkit/shared"
      lint-tool-updates:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
          - "eslint-plugin-*"
      storybook-updates:
        patterns:
          - "@storybook/*"
          - "storybook"
          - "storybook-*"
      stylelint-updates:
        patterns:
          - "stylelint"
          - "stylelint-*"
      a2ui-updates:
        patterns:
          - "@a2ui/*"
      postcss-updates:
        patterns:
          - "*postcss*"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "46ki75"

  - package-ecosystem: "terraform"
    directories:
      - "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "dependencies"
      - "Terraform"
    assignees:
      - "46ki75"
