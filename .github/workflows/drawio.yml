name: draw.io

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check:
    name: Check (@elmethis/draw.io)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: "node pnpm"

      - name: Install dependencies
        run: mise run setup

      - name: Check
        run: mise run drawio:ci
