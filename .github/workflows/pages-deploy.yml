name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time across the repo. `cancel-in-progress:
# false` lets an in-flight deploy finish — cancelling mid-deploy can leave
# the published site in a half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: "node pnpm"

      - name: Install dependencies
        run: mise run setup

      - name: Build and assemble Pages site
        run: mise run pages:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages-site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
