name: Vue

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check:
    name: Check (@elmethis/vue)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: "node pnpm"

      - name: Install dependencies
        run: mise run setup

      - name: Install Playwright Chromium
        run: mise run vue:browser:install --with-deps

      - name: Check
        run: mise run vue:ci

      # Visibility only - never fails the build. Codecov merges both flags.
      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/vue/coverage/lcov.info
          flags: vue-unit
          fail_ci_if_error: false

      - name: Upload browser coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/vue/coverage/browser/lcov.info
          flags: vue-browser
          fail_ci_if_error: false
