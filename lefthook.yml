lefthook: mise exec -- pnpm exec lefthook

output:
  - failure
  - summary

pre-commit:
  parallel: true
  jobs:
    - name: check
      run: mise run check

fmt:
  files: git ls-files
  parallel: true
  jobs:
    # Oxfmt runs once from the repo root because it has one repository-wide
    # config. This also covers non-package files such as root configs and hooks.
    - name: oxfmt
      run: pnpm exec oxfmt --write {files}
      glob: "*.{js,ts,jsx,tsx,json}"
      exclude: &oxfmt-excludes
        - "node_modules/**"
        - "**/node_modules/**"
        - "dist/**"
        - "**/dist/**"
        - "lib/**"
        - "**/lib/**"
        - "lib-types/**"
        - "**/lib-types/**"
        - "storybook-static/**"
        - "**/storybook-static/**"
        - "package-lock.json"
        - "**/package-lock.json"
        - "package.json"
        - "**/package.json"
        - ".mise/locks/**"

fmt-check:
  files: git ls-files
  jobs:
    - name: oxfmt
      run: pnpm exec oxfmt --check {files}
      glob: "*.{js,ts,jsx,tsx,json}"
      exclude: *oxfmt-excludes

check:
  parallel: true
  jobs:
    # Every job runs per-package: `root:` sets the CWD so each package's own
    # config (eslint.config.ts / stylelint.config.mjs / vitest config) resolves
    # deterministically instead of relying on the tool walking up from the repo
    # root, and rebases {files} relative to it. The glob is matched against the
    # repo-root-relative path; `**` matches one-or-more dirs deep, so
    # `packages/<pkg>/**` covers everything under the package (e.g. src/) while
    # skipping top-level package config files.

    - name: configs
      run: pnpm run check.configs

    - name: eslint-core
      root: "packages/core/"
      glob: "packages/core/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-react
      root: "packages/react/"
      glob: "packages/react/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-solid
      root: "packages/solid/"
      glob: "packages/solid/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-vue
      root: "packages/vue/"
      glob: "packages/vue/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-ag-ui-stub
      root: "packages/ag-ui-stub/"
      glob: "packages/ag-ui-stub/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-copilotkit
      root: "packages/copilotkit/"
      glob: "packages/copilotkit/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-drawio
      root: "packages/drawio/"
      glob: "packages/drawio/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: eslint-ikuma-theme
      root: "packages/ikuma-theme/"
      glob: "packages/ikuma-theme/**/*.{ts,tsx}"
      run: pnpm exec eslint {files}

    - name: stylelint-react
      root: "packages/react/"
      glob: "packages/react/**/*.{css,scss,sass,less}"
      run: pnpm exec stylelint {files}

    - name: stylelint-solid
      root: "packages/solid/"
      glob: "packages/solid/**/*.{css,scss,sass,less}"
      run: pnpm exec stylelint {files}

    - name: stylelint-vue
      root: "packages/vue/"
      glob: "packages/vue/**/*.{css,scss,sass,less}"
      run: pnpm exec stylelint {files}

    # vitest: `related` runs only the unit tests covering the changed files, and
    # --passWithNoTests keeps edits with no related test green.
    - name: vitest-core
      root: "packages/core/"
      glob: "packages/core/**/*.{ts,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {files}

    - name: vitest-react
      root: "packages/react/"
      glob: "packages/react/**/*.{ts,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {files}

    - name: vitest-solid
      root: "packages/solid/"
      glob: "packages/solid/**/*.{ts,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {files}

    - name: vitest-solid-ssr
      root: "packages/solid/"
      glob: "packages/solid/**/*.{ts,tsx}"
      run: pnpm exec vitest --run --config vitest.ssr.config.ts --passWithNoTests

    - name: vitest-vue
      root: "packages/vue/"
      glob: "packages/vue/**/*.{ts,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {files}

    - name: vitest-ag-ui-stub
      root: "packages/ag-ui-stub/"
      glob: "packages/ag-ui-stub/**/*.{ts,tsx}"
      run: pnpm exec vitest related --run --passWithNoTests {files}
