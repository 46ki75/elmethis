min_version = "2026.9.9"
monorepo_root = true

[monorepo]
config_roots = ["packages/*"]

[tools]
node = "22.23.2"

[tool_config]
locked = true

[task_config]
shell = "bash -euo pipefail -c"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
# Keep package.json's pnpm pin ahead of an alternate global npm:pnpm install.
disable_tools = ["npm:pnpm", "rust"]
auto_install = false
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Install locked workspace dependencies and Git hooks"
run = ["pnpm install --frozen-lockfile", "pnpm exec lefthook install"]

[tasks.fmt]
description = "Format tracked files; accepts repeated --file arguments"
raw_args = true
run = "pnpm exec lefthook run fmt --no-auto-install"

[tasks.fmt-check]
description = "Check the same file scope as fmt"
raw_args = true
run = "pnpm exec lefthook run fmt-check --no-auto-install"

[tasks.lint]
description = "Lint every package"
depends = ["//...:lint"]

[tasks."check:quick"]
description = "Run fast formatting, lint, and type checks across the workspace"
depends = ["fmt-check --all-files", "configs:check", "//...:check:quick"]

[tasks.check]
description = "Run the complete workspace quality gate"
depends = [":check:quick", "//...:check"]

[tasks.build]
description = "Build all workspace packages in dependency order"
depends = ["//...:build"]

[tasks.test]
description = "Run unit and SSR tests (browser tests have separate tasks)"
depends = ["//...:test"]

[tasks."configs:check"]
description = "Check shared formatter, linter, and TypeScript configuration"
run = "pnpm run check.configs"

[tasks."storybook:build"]
description = "Build every framework Storybook"
depends = ["//...:storybook:build"]

[tasks."pages:build"]
description = "Build Storybooks and assemble the GitHub Pages site"
depends = [":storybook:build"]
run = '''
rm -rf ./pages-site
mkdir -p ./pages-site/a2ui/v0_9
cp ./index.html ./pages-site/index.html
cp -r ./packages/react/storybook-static ./pages-site/react
cp -r ./packages/solid/storybook-static ./pages-site/solid
cp -r ./packages/vue/storybook-static ./pages-site/vue
cp ./packages/core/dist/a2ui/v0_9/notion_block_catalog.json ./pages-site/a2ui/v0_9/notion_block_catalog.json
'''
