[tasks.build]
alias = "core:build"
description = "Build core modules, tokens, designs, and catalogs"
# The workspace CI task also runs this package's CI gate, which rebuilds dist internally.
# Serialize these writers before dependent package gates consume core output.
wait_for = [":ci"]
run = "pnpm run build"

[tasks.dev]
description = "Watch the core library"
run = "pnpm run dev"

[tasks.fmt]
description = "Format core sources"
run = "pnpm run fmt"

[tasks.fmt-check]
description = "Check core source formatting"
run = "pnpm run fmt.check"

[tasks.lint]
description = "Lint core sources"
run = "pnpm run lint"

[tasks.check]
alias = "core:check"
description = "Check core formatting, lint, and types"
run = "pnpm run check"

[tasks.ci]
alias = "core:ci"
description = "Run the core CI gate including coverage"
depends = ["//:configs:check"]
run = "pnpm run check.ci"

[tasks.test]
alias = "core:test"
description = "Run core unit tests"
run = "pnpm run test.unit"
