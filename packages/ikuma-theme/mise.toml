[tasks.build]
alias = "ikuma-theme:build"
description = "Build VS Code, Shiki, Windows Terminal, and VSIX artifacts"
run = "pnpm run build"

[tasks.dev]
description = "Watch and regenerate theme artifacts"
run = "pnpm run dev"

[tasks.fmt]
description = "Format theme package sources"
run = "pnpm run fmt"

[tasks.fmt-check]
description = "Check theme package formatting"
run = "pnpm run fmt.check"

[tasks.lint]
description = "Lint theme package sources"
run = "pnpm run lint"

[tasks.check]
alias = "ikuma-theme:check"
description = "Check and build all theme artifacts"
run = "pnpm run check"

[tasks.ci]
alias = "ikuma-theme:ci"
description = "Run the theme package CI gate"
depends = [":check"]
